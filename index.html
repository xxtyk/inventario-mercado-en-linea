<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InventApp</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#070b16;
  color:#fff;
  padding-bottom:120px;
}

header{
  background:#0b1020;
  padding:18px;
  font-size:28px;
  font-weight:bold;
}

.container{padding:18px}

.login{
  max-width:420px;
  margin:40px auto;
  background:#111827;
  padding:20px;
  border-radius:20px;
}

input,textarea{
  width:100%;
  padding:15px;
  margin:8px 0;
  font-size:18px;
  border-radius:12px;
  border:0;
}

button{
  border:0;
  border-radius:14px;
  padding:14px;
  font-size:18px;
  color:white;
  background:#8b5cf6;
  width:100%;
}

.formulario,.card,.box{
  background:#111827;
  border:1px solid #263247;
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
}

.totales{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.box{text-align:center}

.box b{
  font-size:30px;
  display:block;
}

.verde{color:#31d079}
.morado{color:#9b5cff}
.amarillo{color:#ffd166}

.fila{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  text-align:center;
  align-items:center;
  gap:8px;
}

.num{
  font-size:28px;
  font-weight:bold;
}

.inicio-editable{
  width:90px;
  text-align:center;
  background:#fff;
  color:#000;
  border-radius:10px;
  border:0;
  padding:8px;
  font-size:28px;
  font-weight:bold;
}

.btn-mini{
  width:45px;
  height:45px;
  border-radius:50%;
  margin:4px;
}

.btn-menos{background:#1b2233}
.btn-borrar{background:#222;margin-bottom:10px}

.btn-comisiones{
  background:#f59e0b;
  margin:12px 0;
  color:#111;
  font-weight:bold;
}

.cerrar{
  position:fixed;
  bottom:18px;
  left:18px;
  right:18px;
  background:#8b5cf6;
  font-size:24px;
  font-weight:bold;
}

.oculto{display:none}

.error{
  color:#ff8080;
  margin-top:10px;
}

.tabla-comision{
  background:#0b1222;
  padding:12px;
  border-radius:14px;
  margin-bottom:12px;
}

.tabla-comision h3{
  margin:0 0 8px;
}

.ganancia{
  font-size:22px;
  font-weight:bold;
  color:#31d079;
}
</style>
</head>

<body>

<header>📦 InventApp</header>

<div id="loginBox" class="login">

  <h2>Entrar al inventario</h2>

  <input
    id="email"
    type="email"
    value="htolosarodriguez@gmail.com"
    placeholder="Correo"
  >

  <div style="position:relative">

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
      style="padding-right:60px"
    >

    <button
      type="button"
      onclick="verPassword()"
      style="
        position:absolute;
        right:8px;
        top:8px;
        width:auto;
        padding:10px;
        background:#222;
        font-size:16px;
      "
    >
      👁️
    </button>

  </div>

  <button type="button" onclick="iniciarSesion()">
    Entrar
  </button>

  <div id="error" class="error"></div>

</div>


<div id="app" class="container oculto">

  <button onclick="logout()">
    Cerrar sesión
  </button>

  <h1 id="fechaTexto"></h1>

  <input
    id="fechaManual"
    type="date"
    onchange="cargarInventario()"
  >

  <button
    class="btn-comisiones"
    onclick="mostrarComisiones()"
  >
    💰 Comisiones
  </button>

  <div
    id="seccionComisiones"
    class="formulario oculto"
  >

    <h2>💰 Costos, ventas y ganancias</h2>

    <div id="listaComisiones"></div>

  </div>


  <div class="totales">

    <div class="box">
      Inicio
      <b id="inicioTotal">0</b>
    </div>

    <div class="box">
      Vendido
      <b class="verde" id="vendidoTotal">0</b>
    </div>

    <div class="box">
      Final
      <b class="morado" id="finalTotal">0</b>
    </div>

  </div>


  <div id="lista"></div>


  <div class="formulario">

    <h2>+ Agregar producto</h2>

    <input
      id="nombre"
      placeholder="Nombre del producto"
    >

    <input
      id="cantidad"
      type="number"
      placeholder="Cantidad inicial"
    >

    <input
      id="costo"
      type="number"
      placeholder="Cuánto costó"
    >

    <input
      id="venta"
      type="number"
      placeholder="A cuánto se vende"
    >

    <button onclick="agregarProducto()">
      Agregar producto
    </button>

  </div>


  <div class="formulario">

    <h2>📝 Notas del día</h2>

    <textarea
      id="notas"
      placeholder="Notas..."
    ></textarea>

  </div>

</div>


<button
  id="btnCerrar"
  class="cerrar oculto"
  onclick="cerrarDia()"
>
🌙 Cerrar día
</button>


<script>

const SUPABASE_URL =
"https://nbeztoulibouaiwhkkzx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rBfUEuSG0oN__EW38QL68w_1rJ-deQp";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let productos = [];
let registroId = null;
let guardando = false;

const fechaInput =
document.getElementById("fechaManual");


/* =========================
   FECHA LOCAL
========================= */

function hoyLocal(){

  const f = new Date();

  return (
    f.getFullYear() + "-" +
    String(f.getMonth()+1).padStart(2,"0") + "-" +
    String(f.getDate()).padStart(2,"0")
  );
}


/* =========================
   FECHA OPERATIVA GUARDADA
========================= */

let fechaGuardada =
localStorage.getItem("fechaInventario");

if(!fechaGuardada){

  fechaGuardada = hoyLocal();

  localStorage.setItem(
    "fechaInventario",
    fechaGuardada
  );
}

fechaInput.value = fechaGuardada;


/* =========================
   CONTRASEÑA
========================= */

function verPassword(){

  const pass =
  document.getElementById("password");

  pass.type =
  pass.type === "password"
  ? "text"
  : "password";
}


/* =========================
   TEXTO DE FECHA
========================= */

function textoFecha(){

  const p = fechaInput.value.split("-");

  const f = new Date(
    Number(p[0]),
    Number(p[1])-1,
    Number(p[2])
  );

  return f.toLocaleDateString(
    "es-MX",
    {
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );
}


/* =========================
   LOGIN
========================= */

async function iniciarSesion(){

  const email =
  document.getElementById("email")
  .value.trim();

  const password =
  document.getElementById("password")
  .value.trim();

  const { error } =
  await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){

    document.getElementById("error")
    .innerText =
    "Correo o contraseña incorrectos";

    return;
  }

  await mostrarApp();
}


async function logout(){

  await db.auth.signOut();

  location.reload();
}


async function revisarSesion(){

  const { data } =
  await db.auth.getSession();

  if(data.session){

    await mostrarApp();
  }
}


/* =========================
   ABRIR APP
========================= */

async function mostrarApp(){

  document.getElementById("loginBox")
  .classList.add("oculto");

  document.getElementById("app")
  .classList.remove("oculto");

  document.getElementById("btnCerrar")
  .classList.remove("oculto");


  /*
    IMPORTANTE:
    AL ENTRAR BUSCAMOS EL ÚLTIMO
    DÍA OPERATIVO EXISTENTE.
  */

  const { data:ultimoDia, error } =
  await db
  .from("inventario")
  .select("Fecha")
  .order("Fecha",{ascending:false})
  .limit(1);


  if(
    !error &&
    ultimoDia &&
    ultimoDia.length > 0
  ){

    fechaInput.value =
    ultimoDia[0].Fecha;

    localStorage.setItem(
      "fechaInventario",
      ultimoDia[0].Fecha
    );

  }else{

    fechaInput.value =
    localStorage.getItem(
      "fechaInventario"
    ) || hoyLocal();
  }

  await cargarInventario();
}


/* =========================
   CARGAR INVENTARIO
========================= */

async function cargarInventario(){

  if(!fechaInput.value){
    return;
  }

  localStorage.setItem(
    "fechaInventario",
    fechaInput.value
  );

  document.getElementById("fechaTexto")
  .innerText = textoFecha();

  registroId = null;
  productos = [];

  document.getElementById("notas")
  .value = "";


  const { data, error } =
  await db
  .from("inventario")
  .select("*")
  .eq("Fecha",fechaInput.value)
  .limit(1);


  if(error){

    alert(
      "Error al cargar: " +
      error.message
    );

    return;
  }


  /*
    SI EL DÍA YA EXISTE,
    CARGAMOS EXACTAMENTE
    LO QUE ESTÁ GUARDADO.
  */

  if(data && data.length > 0){

    registroId = data[0].id;

    const guardado =
    data[0].Data || {};

    productos =
    guardado.productos || [];

    document.getElementById("notas")
    .value =
    guardado.notas || "";

    mostrar();

    return;
  }


  /*
    SI EL DÍA NO EXISTE,
    BUSCAMOS EL ANTERIOR.
  */

  const { data:ultimoDia } =
  await db
  .from("inventario")
  .select("*")
  .lt("Fecha",fechaInput.value)
  .order("Fecha",{ascending:false})
  .limit(1);


  if(
    ultimoDia &&
    ultimoDia.length > 0
  ){

    const guardado =
    ultimoDia[0].Data || {};

    productos =
    (guardado.productos || [])
    .map(p=>({

      nombre:p.nombre,

      inicio:
      (Number(p.inicio) || 0) -
      (Number(p.vendido) || 0),

      vendido:0,

      costo:Number(p.costo) || 0,

      venta:Number(p.venta) || 0

    }));

    await guardarInventario();

    alert(
      "Se copió automáticamente el último inventario."
    );
  }

  mostrar();
}


/* =========================
   GUARDAR INMEDIATAMENTE
========================= */

async function guardarInventario(){

  if(!fechaInput.value){
    return false;
  }

  guardando = true;

  const datos = {

    productos:productos,

    notas:
    document.getElementById("notas")
    .value,

    actualizado:
    new Date().toISOString()
  };


  if(registroId){

    const { error } =
    await db
    .from("inventario")
    .update({
      Data:datos
    })
    .eq("id",registroId);


    if(error){

      guardando = false;

      alert(
        "NO SE PUDO GUARDAR: " +
        error.message
      );

      return false;
    }

  }else{

    const { data,error } =
    await db
    .from("inventario")
    .insert([{
      Fecha:fechaInput.value,
      Data:datos
    }])
    .select()
    .single();


    if(error){

      guardando = false;

      alert(
        "NO SE PUDO GUARDAR: " +
        error.message
      );

      return false;
    }

    registroId = data.id;
  }

  guardando = false;

  return true;
}


/* =========================
   AGREGAR PRODUCTO
========================= */

async function agregarProducto(){

  const nombre =
  document.getElementById("nombre")
  .value.trim();

  const cantidad =
  parseInt(
    document.getElementById("cantidad")
    .value
  );

  const costo =
  parseFloat(
    document.getElementById("costo")
    .value
  ) || 0;

  const venta =
  parseFloat(
    document.getElementById("venta")
    .value
  ) || 0;


  if(!nombre || isNaN(cantidad)){

    alert(
      "Escribe producto y cantidad"
    );

    return;
  }


  productos.push({

    nombre:nombre,
    inicio:cantidad,
    vendido:0,
    costo:costo,
    venta:venta

  });


  /*
    SE GUARDA ANTES DE
    CONTINUAR.
  */

  const guardado =
  await guardarInventario();


  if(!guardado){
    return;
  }


  document.getElementById("nombre")
  .value = "";

  document.getElementById("cantidad")
  .value = "";

  document.getElementById("costo")
  .value = "";

  document.getElementById("venta")
  .value = "";

  mostrar();
}


/* =========================
   MARCAR VENTA +
========================= */

async function vender(i){

  if(guardando){
    return;
  }

  if(
    productos[i].vendido <
    productos[i].inicio
  ){

    productos[i].vendido++;

    /*
      CADA + SE GUARDA
      INMEDIATAMENTE.
    */

    const guardado =
    await guardarInventario();

    if(!guardado){

      productos[i].vendido--;

      mostrar();

      return;
    }

    mostrar();
  }
}


/* =========================
   REGRESAR VENTA -
========================= */

async function regresar(i){

  if(guardando){
    return;
  }

  if(productos[i].vendido > 0){

    productos[i].vendido--;

    /*
      CADA - SE GUARDA
      INMEDIATAMENTE.
    */

    const guardado =
    await guardarInventario();

    if(!guardado){

      productos[i].vendido++;

      mostrar();

      return;
    }

    mostrar();
  }
}


/* =========================
   EDITAR INICIO
========================= */

async function editarInicio(i,valor){

  valor = parseInt(valor);

  if(isNaN(valor) || valor < 0){

    alert("Cantidad incorrecta");

    mostrar();

    return;
  }


  const inicioAnterior =
  productos[i].inicio;

  const vendidoAnterior =
  productos[i].vendido;


  productos[i].inicio = valor;


  if(
    productos[i].vendido >
    valor
  ){

    productos[i].vendido =
    valor;
  }


  const guardado =
  await guardarInventario();


  if(!guardado){

    productos[i].inicio =
    inicioAnterior;

    productos[i].vendido =
    vendidoAnterior;

    mostrar();

    return;
  }

  mostrar();
}


/* =========================
   COSTO / PRECIO
========================= */

async function editarDato(
  i,
  campo,
  valor
){

  const anterior =
  productos[i][campo];

  valor =
  parseFloat(valor) || 0;

  productos[i][campo] =
  valor;


  const guardado =
  await guardarInventario();


  if(!guardado){

    productos[i][campo] =
    anterior;
  }

  mostrarComisiones(true);
}


/* =========================
   BORRAR PRODUCTO
========================= */

async function borrar(i){

  if(
    confirm(
      "¿Borrar producto completo?"
    )
  ){

    const productoBorrado =
    productos[i];

    productos.splice(i,1);


    const guardado =
    await guardarInventario();


    if(!guardado){

      productos.splice(
        i,
        0,
        productoBorrado
      );
    }

    mostrar();
  }
}


/* =========================
   COMISIONES
========================= */

function mostrarComisiones(
  mantenerAbierto
){

  const seccion =
  document.getElementById(
    "seccionComisiones"
  );


  if(!mantenerAbierto){

    seccion.classList.toggle(
      "oculto"
    );
  }


  const lista =
  document.getElementById(
    "listaComisiones"
  );

  lista.innerHTML = "";


  productos.forEach((p,i)=>{

    if(p.costo === undefined)
      p.costo = 0;

    if(p.venta === undefined)
      p.venta = 0;


    const ganancia =
    Number(p.venta) -
    Number(p.costo);


    lista.innerHTML += `

      <div class="tabla-comision">

        <h3>${p.nombre}</h3>

        <label>
          Cuánto costó
        </label>

        <input
          type="number"
          value="${p.costo}"
          onchange="
          editarDato(
            ${i},
            'costo',
            this.value
          )"
        >

        <label>
          A cuánto se vende
        </label>

        <input
          type="number"
          value="${p.venta}"
          onchange="
          editarDato(
            ${i},
            'venta',
            this.value
          )"
        >

        <div class="ganancia">
          Ganancia: $${ganancia}
        </div>

      </div>
    `;
  });
}


/* =========================
   MOSTRAR PRODUCTOS
========================= */

function mostrar(){

  const lista =
  document.getElementById("lista");

  lista.innerHTML = "";


  let inicioTotal = 0;
  let vendidoTotal = 0;
  let finalTotal = 0;


  productos.forEach((p,i)=>{

    p.inicio =
    Number(p.inicio) || 0;

    p.vendido =
    Number(p.vendido) || 0;

    if(p.costo === undefined)
      p.costo = 0;

    if(p.venta === undefined)
      p.venta = 0;


    const final =
    p.inicio - p.vendido;


    inicioTotal += p.inicio;

    vendidoTotal +=
    p.vendido;

    finalTotal += final;


    lista.innerHTML += `

      <div class="card">

        <button
          class="btn-borrar"
          onclick="borrar(${i})"
        >
          🗑️ Borrar producto
        </button>


        <h2>${p.nombre}</h2>


        <div class="fila">


          <div>

            Inicio
            <br>

            <input
              type="number"
              value="${p.inicio}"
              class="inicio-editable"
              onchange="
              editarInicio(
                ${i},
                this.value
              )"
            >

          </div>


          <div>

            Vendido
            <br>

            <button
              class="btn-mini btn-menos"
              onclick="regresar(${i})"
            >
              −
            </button>


            <span class="num verde">
              ${p.vendido}
            </span>


            <button
              class="btn-mini"
              onclick="vender(${i})"
            >
              +
            </button>

          </div>


          <div>

            Final

            <div class="num morado">
              ${final}
            </div>

          </div>


        </div>

      </div>
    `;
  });


  document.getElementById(
    "inicioTotal"
  ).innerText =
  inicioTotal;


  document.getElementById(
    "vendidoTotal"
  ).innerText =
  vendidoTotal;


  document.getElementById(
    "finalTotal"
  ).innerText =
  finalTotal;


  if(
    !document.getElementById(
      "seccionComisiones"
    )
    .classList.contains("oculto")
  ){

    mostrarComisiones(true);
  }
}


/* =========================
   NOTAS
========================= */

let temporizadorNotas;

document.getElementById("notas")
.addEventListener(
  "input",
  function(){

    clearTimeout(
      temporizadorNotas
    );

    temporizadorNotas =
    setTimeout(
      guardarInventario,
      400
    );
  }
);


/* =========================
   CERRAR DÍA
========================= */

async function cerrarDia(){

  if(
    !confirm(
      "¿Cerrar este día?"
    )
  ){
    return;
  }


  /*
    PRIMERO ASEGURAMOS
    QUE EL DÍA ACTUAL
    ESTÉ GUARDADO.
  */

  const guardadoActual =
  await guardarInventario();


  if(!guardadoActual){

    alert(
      "No se cerró el día porque el inventario actual no pudo guardarse."
    );

    return;
  }


  /*
    EL FINAL DE HOY
    SE CONVIERTE EN
    EL INICIO DE MAÑANA.
  */

  const productosSiguienteDia =
  productos.map(p=>({

    nombre:p.nombre,

    inicio:
    (Number(p.inicio) || 0) -
    (Number(p.vendido) || 0),

    vendido:0,

    costo:
    Number(p.costo) || 0,

    venta:
    Number(p.venta) || 0

  }));


  /*
    CALCULAR SIGUIENTE DÍA
  */

  const partes =
  fechaInput.value.split("-");

  const fecha =
  new Date(
    Number(partes[0]),
    Number(partes[1])-1,
    Number(partes[2])
  );


  fecha.setDate(
    fecha.getDate()+1
  );


  const siguienteDia =

    fecha.getFullYear() + "-" +

    String(
      fecha.getMonth()+1
    ).padStart(2,"0") + "-" +

    String(
      fecha.getDate()
    ).padStart(2,"0");


  const datosSiguienteDia = {

    productos:
    productosSiguienteDia,

    notas:"",

    actualizado:
    new Date().toISOString()
  };


  /*
    VER SI EL SIGUIENTE
    DÍA YA EXISTE.
  */

  const {
    data:diaExistente,
    error:errorBuscar
  } =
  await db
  .from("inventario")
  .select("*")
  .eq("Fecha",siguienteDia)
  .limit(1);


  if(errorBuscar){

    alert(
      "Error al buscar el siguiente día: " +
      errorBuscar.message
    );

    return;
  }


  if(
    diaExistente &&
    diaExistente.length > 0
  ){

    const { error } =
    await db
    .from("inventario")
    .update({
      Data:datosSiguienteDia
    })
    .eq(
      "id",
      diaExistente[0].id
    );


    if(error){

      alert(
        "Error al actualizar el siguiente día: " +
        error.message
      );

      return;
    }

  }else{

    const { error } =
    await db
    .from("inventario")
    .insert([{

      Fecha:siguienteDia,

      Data:
      datosSiguienteDia

    }]);


    if(error){

      alert(
        "Error al crear el siguiente día: " +
        error.message
      );

      return;
    }
  }


  /*
    CAMBIAMOS AL NUEVO
    DÍA OPERATIVO.
  */

  fechaInput.value =
  siguienteDia;


  localStorage.setItem(
    "fechaInventario",
    siguienteDia
  );


  await cargarInventario();


  alert(
    "Día cerrado correctamente. El inventario final pasó al siguiente día."
  );
