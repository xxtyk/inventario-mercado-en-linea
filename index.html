<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InventApp</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#070b16;
  color:white;
  padding-bottom:130px;
}

header{
  background:#0b1020;
  padding:18px;
  font-size:28px;
  font-weight:bold;
}

.container{
  padding:18px;
}

h1{
  font-size:30px;
}

input,textarea{
  width:100%;
  padding:15px;
  margin:8px 0;
  font-size:20px;
  border-radius:12px;
  border:0;
  background:#fff;
  color:#000;
}

button{
  border:0;
  border-radius:14px;
  padding:14px;
  font-size:20px;
  color:white;
  background:#8b5cf6;
}

.login{
  max-width:420px;
  margin:40px auto;
  background:#111827;
  padding:20px;
  border-radius:20px;
}

.card,.box,.formulario{
  background:#111827;
  border:1px solid #263247;
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
}

.totales{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.box{
  text-align:center;
}

.box b{
  font-size:32px;
  display:block;
}

.verde{color:#31d079}
.morado{color:#9b5cff}

.fila{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  text-align:center;
  align-items:center;
}

.num{
  font-size:30px;
  font-weight:bold;
}

.btn-mini{
  width:48px;
  height:48px;
  border-radius:50%;
  margin:4px;
}

.btn-menos{
  background:#1b2233;
}

.btn-editar{
  background:#2563eb;
  margin-top:12px;
  width:100%;
}

.btn-mercancia{
  background:#16a34a;
  margin-top:10px;
  width:100%;
}

.btn-borrar{
  background:#222;
  float:right;
}

.info{
  margin-top:12px;
  font-size:16px;
  line-height:1.5;
  background:#0b1222;
  padding:12px;
  border-radius:12px;
}

.cerrar{
  position:fixed;
  bottom:18px;
  left:18px;
  right:18px;
  background:#8b5cf6;
  font-size:26px;
  font-weight:bold;
}

.oculto{
  display:none;
}

.error{
  color:#ff8080;
  margin-top:10px;
}
</style>
</head>

<body>

<header>📦 InventApp</header>

<div id="login" class="login">
  <h2>Entrar al inventario</h2>
  <input id="email" type="email" value="htolosarodriguez@gmail.com" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">
  <button onclick="login()">Entrar</button>
  <div id="error" class="error"></div>
</div>

<div id="app" class="container oculto">

  <button onclick="logout()">Cerrar sesión</button>

  <h1 id="fechaTexto"></h1>
  <input id="fechaManual" type="date" onchange="cargarInventario()">

  <div class="totales">
    <div class="box">Inicio<b id="inicioTotal">0</b></div>
    <div class="box">Vendido<b class="verde" id="vendidoTotal">0</b></div>
    <div class="box">Final<b class="morado" id="finalTotal">0</b></div>
  </div>

  <div id="lista"></div>

  <div class="formulario">
    <h2>+ Agregar producto</h2>

    <input id="nombre" placeholder="Nombre del producto">
    <input id="cantidad" type="number" placeholder="Cantidad inicial">
    <input id="costo" type="number" placeholder="Cuánto costó">
    <input id="venta" type="number" placeholder="Cuánto se vende">
    <input id="comision" type="number" placeholder="Comisión que da">

    <button onclick="agregarProducto()">Agregar producto</button>
  </div>

  <div class="formulario">
    <h2>📝 Notas del día</h2>
    <textarea id="notas" placeholder="Notas..."></textarea>
  </div>

</div>

<button id="btnCerrar" class="cerrar oculto" onclick="cerrarDia()">🌙 Cerrar día</button>

<script>
const SUPABASE_URL = "https://nbeztoulibouaiwhkkzx.supabase.co";
const SUPABASE_KEY = "sb_publishable_rBfUEuSG0oN__EW38QL68w_1rJ-deQp";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let productos = [];
let registroId = null;

const fechaInput = document.getElementById("fechaManual");

function hoy(){
  return new Date().toISOString().split("T")[0];
}

fechaInput.value = hoy();

function textoFecha(){
  const p = fechaInput.value.split("-");
  const f = new Date(p[0], p[1]-1, p[2]);

  return f.toLocaleDateString("es-MX",{
    weekday:"long",
    year:"numeric",
    month:"long",
    day:"numeric"
  });
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  const { error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    document.getElementById("error").innerText =
      "Correo o contraseña incorrectos";
    return;
  }

  mostrarApp();
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

async function revisarSesion(){
  const { data } = await db.auth.getSession();

  if(data.session){
    mostrarApp();
  }
}

async function mostrarApp(){
  document.getElementById("login").classList.add("oculto");
  document.getElementById("app").classList.remove("oculto");
  document.getElementById("btnCerrar").classList.remove("oculto");

  await cargarInventario();
}

async function cargarInventario(){
  document.getElementById("fechaTexto").innerText = textoFecha();

  registroId = null;
  productos = [];
  document.getElementById("notas").value = "";

  let { data, error } = await db
    .from("inventario")
    .select("*")
    .eq("Fecha", fechaInput.value)
    .limit(1);

  if(error){
    alert("Error al cargar: " + error.message);
    return;
  }

  if(data && data.length > 0){
    registroId = data[0].id;
    const guardado = data[0].Data || {};
    productos = guardado.productos || [];
    document.getElementById("notas").value = guardado.notas || "";
  }

  mostrar();
}
