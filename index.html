<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InventApp</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#070b16;color:white;padding-bottom:110px}
header{background:#0b1020;padding:18px;font-size:28px;font-weight:bold}
.container{padding:18px}
.subtitulo{color:#a56cff;font-weight:bold}
h1{font-size:30px;margin:10px 0}
input{width:100%;padding:15px;font-size:20px;border-radius:12px;margin-bottom:10px}
button{border:0;border-radius:14px;padding:14px;font-size:20px;color:white;background:#8b5cf6}
.card{background:#111827;border-radius:20px;padding:18px;margin-bottom:12px}
.num{font-size:28px}
.cerrar{position:fixed;bottom:18px;left:18px;right:18px;background:#8b5cf6;font-size:24px}
</style>
</head>
<body>

<header>📦 Inventario</header>

<div class="container">

<div class="subtitulo">DÍA</div>
<h1 id="fecha"></h1>

<input id="fechaManual" type="date">

<input id="nombre" placeholder="Producto">
<input id="cantidad" type="number" placeholder="Cantidad">

<button onclick="agregar()">Agregar</button>

<div id="lista"></div>

</div>

<button class="cerrar" onclick="cerrarDia()">Cerrar día</button>

<script>
let productos = JSON.parse(localStorage.getItem("productos")) || [];
let historial = JSON.parse(localStorage.getItem("historial")) || [];

const fechaInput = document.getElementById("fechaManual");

function hoy(){
  const f = new Date();
  return f.toISOString().split("T")[0];
}

fechaInput.value = localStorage.getItem("fecha") || hoy();

function textoFecha(){
  const p = fechaInput.value.split("-");
  const f = new Date(p[0], p[1]-1, p[2]);
  return f.toLocaleDateString("es-MX",{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

document.getElementById("fecha").innerText = textoFecha();

fechaInput.onchange = () => {
  localStorage.setItem("fecha", fechaInput.value);
  document.getElementById("fecha").innerText = textoFecha();
};

function guardar(){
  localStorage.setItem("productos", JSON.stringify(productos));
  mostrar();
}

function agregar(){
  let n = document.getElementById("nombre").value;
  let c = parseInt(document.getElementById("cantidad").value);

  if(!n || !c){alert("Datos");return;}

  productos.push({nombre:n,inicio:c,vendido:0});
  document.getElementById("nombre").value="";
  document.getElementById("cantidad").value="";
  guardar();
}

function vender(i){
  if(productos[i].vendido < productos[i].inicio){
    productos[i].vendido++;
    guardar();
  }
}

function mostrar(){
  let html="";
  productos.forEach((p,i)=>{
    html+=`
    <div class="card">
      <b>${p.nombre}</b><br>
      Inicio: ${p.inicio} <br>
      Vendido: ${p.vendido} 
      <button onclick="vender(${i})">+</button><br>
      Final: ${p.inicio-p.vendido}
    </div>`;
  });
  document.getElementById("lista").innerHTML = html;
}

function cerrarDia(){
  let reg = {
    fecha: textoFecha(),
    total: productos.reduce((a,p)=>a+p.vendido,0)
  };

  historial.unshift(reg);
  localStorage.setItem("historial", JSON.stringify(historial));

  productos = productos.map(p=>({
    nombre:p.nombre,
    inicio:p.inicio-p.vendido,
    vendido:0
  }));

  guardar();
}

mostrar();
</script>

</body>
</html>
