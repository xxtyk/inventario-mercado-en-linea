<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InventApp</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#070b16;
  color:#fff;
  padding-bottom:120px;
}

header{
  background:#0b1020;
  padding:18px;
  font-size:28px;
  font-weight:bold;
}

.container{
  padding:18px;
}

.login{
  max-width:420px;
  margin:40px auto;
  background:#111827;
  padding:20px;
  border-radius:20px;
}

input,textarea{
  width:100%;
  padding:15px;
  margin:8px 0;
  font-size:18px;
  border-radius:12px;
  border:0;
}

button{
  border:0;
  border-radius:14px;
  padding:14px;
  font-size:18px;
  color:white;
  background:#8b5cf6;
  width:100%;
}

.formulario,
.card,
.box{
  background:#111827;
  border:1px solid #263247;
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
}

.totales{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.box{
  text-align:center;
}

.box b{
  font-size:30px;
  display:block;
}

.verde{
  color:#31d079;
}

.morado{
  color:#9b5cff;
}

.fila{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  text-align:center;
  align-items:center;
}

.num{
  font-size:28px;
  font-weight:bold;
}

.btn-mini{
  width:45px;
  height:45px;
  border-radius:50%;
  margin:4px;
}

.btn-menos{
  background:#1b2233;
}

.btn-editar{
  background:#2563eb;
  margin-top:10px;
}

.btn-mercancia{
  background:#16a34a;
  margin-top:10px;
}

.btn-borrar{
  background:#222;
  margin-bottom:10px;
}

.info{
  background:#0b1222;
  padding:12px;
  border-radius:12px;
  margin-top:12px;
  line-height:1.5;
}

.cerrar{
  position:fixed;
  bottom:18px;
  left:18px;
  right:18px;
  background:#8b5cf6;
  font-size:24px;
  font-weight:bold;
}

.oculto{
  display:none;
}

.error{
  color:#ff8080;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
📦 InventApp
</header>

<div id="loginBox" class="login">

  <h2>Entrar al inventario</h2>

  <input
    id="email"
    type="email"
    value="htolosarodriguez@gmail.com"
    placeholder="Correo"
  >

  <div style="position:relative">

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
      style="padding-right:60px"
    >

    <button
      type="button"
      onclick="verPassword()"
      style="
        position:absolute;
        right:8px;
        top:8px;
        width:auto;
        padding:10px;
        background:#222;
        font-size:16px;
      "
    >
      👁️
    </button>

  </div>

  <button
    type="button"
    onclick="iniciarSesion()"
  >
    Entrar
  </button>

  <div id="error" class="error"></div>

</div>

<div id="app" class="container oculto">

  <button onclick="logout()">
    Cerrar sesión
  </button>

  <h1 id="fechaTexto"></h1>

  <input
    id="fechaManual"
    type="date"
    onchange="cargarInventario()"
  >

  <div class="totales">

    <div class="box">
      Inicio
      <b id="inicioTotal">0</b>
    </div>

    <div class="box">
      Vendido
      <b class="verde" id="vendidoTotal">0</b>
    </div>

    <div class="box">
      Final
      <b class="morado" id="finalTotal">0</b>
    </div>

  </div>

  <div id="lista"></div>

  <div class="formulario">

    <h2>+ Agregar producto</h2>

    <input
      id="nombre"
      placeholder="Nombre del producto"
    >

    <input
      id="cantidad"
      type="number"
      placeholder="Cantidad inicial"
    >

    <input
      id="costo"
      type="number"
      placeholder="Cuánto costó"
    >

    <input
      id="venta"
      type="number"
      placeholder="Cuánto se vende"
    >

    <input
      id="comision"
      type="number"
      placeholder="Comisión"
    >

    <button onclick="agregarProducto()">
      Agregar producto
    </button>

  </div>

  <div class="formulario">

    <h2>📝 Notas del día</h2>

    <textarea
      id="notas"
      placeholder="Notas..."
    ></textarea>

  </div>

</div>

<button
  id="btnCerrar"
  class="cerrar oculto"
  onclick="cerrarDia()"
>
🌙 Cerrar día
</button>

<script>

const SUPABASE_URL =
"https://nbeztoulibouaiwhkkzx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rBfUEuSG0oN__EW38QL68w_1rJ-deQp";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let productos = [];
let registroId = null;

const fechaInput =
document.getElementById("fechaManual");

function hoy(){
  return new Date()
  .toISOString()
  .split("T")[0];
}

fechaInput.value = hoy();

function verPassword(){

  const pass =
    document.getElementById("password");

  if(pass.type === "password"){
    pass.type = "text";
  }else{
    pass.type = "password";
  }
}

function textoFecha(){

  const p =
    fechaInput.value.split("-");

  const f =
    new Date(p[0], p[1]-1, p[2]);

  return f.toLocaleDateString(
    "es-MX",
    {
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );
}

async function iniciarSesion(){

  const email =
    document.getElementById("email")
    .value
    .trim();

  const password =
    document.getElementById("password")
    .value
    .trim();

  const { error } =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    document
    .getElementById("error")
    .innerText =
    "Correo o contraseña incorrectos";

    return;
  }

  mostrarApp();
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

async function revisarSesion(){

  const { data } =
    await db.auth.getSession();

  if(data.session){
    mostrarApp();
  }
}

async function mostrarApp(){

  document
  .getElementById("loginBox")
  .classList.add("oculto");

  document
  .getElementById("app")
  .classList.remove("oculto");

  document
  .getElementById("btnCerrar")
  .classList.remove("oculto");

  await cargarInventario();
}

async function cargarInventario(){

  document
  .getElementById("fechaTexto")
  .innerText = textoFecha();

  registroId = null;
  productos = [];

  document
  .getElementById("notas")
  .value = "";

  let { data } =
    await db
    .from("inventario")
    .select("*")
    .eq("Fecha", fechaInput.value)
    .limit(1);

  if(data && data.length > 0){

    registroId = data[0].id;

    const guardado =
      data[0].Data || {};

    productos =
      guardado.productos || [];

    document
    .getElementById("notas")
    .value =
      guardado.notas || "";
  }

  mostrar();
}

async function guardarInventario(){

  const datos = {
    productos,
    notas:
      document
      .getElementById("notas")
      .value
  };

  if(registroId){

    await db
    .from("inventario")
    .update({ Data: datos })
    .eq("id", registroId);

  }else{

    const { data } =
      await db
      .from("inventario")
      .insert([
        {
          Fecha: fechaInput.value,
          Data: datos
        }
      ])
      .select()
      .single();

    registroId = data.id;
  }
}

async function agregarProducto(){

  const nombre =
    document
    .getElementById("nombre")
    .value
    .trim();

  const cantidad =
    parseInt(
      document
      .getElementById("cantidad")
      .value
    );

  const costo =
    parseFloat(
      document
      .getElementById("costo")
      .value
    ) || 0;

  const venta =
    parseFloat(
      document
      .getElementById("venta")
      .value
    ) || 0;

  const comision =
    parseFloat(
      document
      .getElementById("comision")
      .value
    ) || 0;

  if(!nombre || isNaN(cantidad)){
    alert("Escribe producto y cantidad");
    return;
  }

  productos.push({
    nombre,
    inicio:cantidad,
    vendido:0,
    costo,
    venta,
    comision
  });

  document.getElementById("nombre").value="";
  document.getElementById("cantidad").value="";
  document.getElementById("costo").value="";
  document.getElementById("venta").value="";
  document.getElementById("comision").value="";

  await guardarInventario();

  mostrar();
}

async function vender(i){

  if(productos[i].vendido <
     productos[i].inicio){

    productos[i].vendido++;

    await guardarInventario();

    mostrar();
  }
}

async function regresar(i){

  if(productos[i].vendido > 0){

    productos[i].vendido--;

    await guardarInventario();

    mostrar();
  }
}

async function agregarMercancia(i){

  const cantidad =
    parseInt(
      prompt(
        "¿Cuánta mercancía llegó?"
      )
    );

  if(isNaN(cantidad) ||
     cantidad <= 0){
    return;
  }

  productos[i].inicio += cantidad;

  await guardarInventario();

  mostrar();
}

async function editarProducto(i){

  const p = productos[i];

  const nuevoNombre =
    prompt(
      "Nombre:",
      p.nombre
    );

  if(nuevoNombre === null) return;

  const nuevoInicio =
    prompt(
      "Cantidad:",
      p.inicio
    );

  if(nuevoInicio === null) return;

  productos[i].nombre =
    nuevoNombre;

  productos[i].inicio =
    parseInt(nuevoInicio) || 0;

  await guardarInventario();

  mostrar();
}

async function borrar(i){

  if(confirm("¿Borrar producto?")){

    productos.splice(i,1);

    await guardarInventario();

    mostrar();
  }
}

function mostrar(){

  let lista =
    document.getElementById("lista");

  lista.innerHTML = "";

  let inicioTotal = 0;
  let vendidoTotal = 0;
  let finalTotal = 0;

  productos.forEach((p,i)=>{

    let final =
      p.inicio - p.vendido;

    inicioTotal += p.inicio;
    vendidoTotal += p.vendido;
    finalTotal += final;

    lista.innerHTML += `
      <div class="card">

        <button
          class="btn-borrar"
          onclick="borrar(${i})"
        >
          🗑️
        </button>

        <h2>${p.nombre}</h2>

        <div class="fila">

          <div>
            Inicio
            <div class="num">
              ${p.inicio}
            </div>
          </div>

          <div>

            Vendido<br>

            <button
              class="btn-mini btn-menos"
              onclick="regresar(${i})"
            >
              −
            </button>

            <span class="num verde">
              ${p.vendido}
            </span>

            <button
              class="btn-mini"
              onclick="vender(${i})"
            >
              +
            </button>

          </div>

          <div>
            Final
            <div class="num morado">
              ${final}
            </div>
          </div>

        </div>

        <div class="info">
          Costo: $${p.costo}<br>
          Venta: $${p.venta}<br>
          Comisión: $${p.comision}
        </div>

        <button
          class="btn-mercancia"
          onclick="agregarMercancia(${i})"
        >
          ➕ Agregar mercancía
        </button>

        <button
          class="btn-editar"
          onclick="editarProducto(${i})"
        >
          ✏️ Editar producto
        </button>

      </div>
    `;
  });

  document
  .getElementById("inicioTotal")
  .innerText = inicioTotal;

  document
  .getElementById("vendidoTotal")
  .innerText = vendidoTotal;

  document
  .getElementById("finalTotal")
  .innerText = finalTotal;
}

document
.getElementById("notas")
.addEventListener(
  "input",
  guardarInventario
);

async function cerrarDia(){

  if(!confirm("¿Cerrar este día?")){
    return;
  }

  productos =
    productos
    .map(p=>({

      nombre:p.nombre,

      inicio:
        p.inicio - p.vendido,

      vendido:0,

      costo:p.costo,
      venta:p.venta,
      comision:p.comision

    }))
    .filter(p=>p.inicio > 0);

  await guardarInventario();

  mostrar();

  alert(
    "Día cerrado y guardado"
  );
}

revisarSesion();

</script>

</body>
</html>
